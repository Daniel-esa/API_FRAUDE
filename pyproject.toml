[project]
name = "API_Fraude"
version = "0.1.0"
description = "API et interface Streamlit de détection de fraude"
keywords = ["API", "Fraude", "Streamlit"]
readme = "README.md"
requires-python = ">=3.13"
license = {file = "LICENSE.txt"}
authors = [
  { name="Daniel Sonne", email="dsonne@micropole.com" },
]
maintainers = [
  { name="Daniel Sonne", email="dsonne@micropole.com" },
]
dependencies = [
  "altair==5.5.0",
  "annotated-types==0.7.0",
  "anyio==4.9.0",
  "attrs==25.3.0",
  "blinker==1.9.0",
  "cachetools==6.1.0",
  "certifi==2025.7.14",
  "charset-normalizer==3.4.2",
  "click==8.2.1",
  "colorama==0.4.6",
  "et_xmlfile==2.0.0",
  "fastapi==0.116.1",
  "gitdb==4.0.12",
  "GitPython==3.1.44",
  "h11==0.16.0",
  "idna==3.10",
  "Jinja2==3.1.6",
  "joblib==1.5.1",
  "jsonschema==4.25.0",
  "jsonschema-specifications==2025.4.1",
  "MarkupSafe==3.0.2",
  "narwhals==1.48.0",
  "numpy==2.3.1",
  "openpyxl==3.1.5",
  "packaging==25.0",
  "pandas==2.3.1",
  "pillow==11.3.0",
  "protobuf==6.31.1",
  "pyarrow==21.0.0",
  "pydantic==2.11.7",
  "pydantic_core==2.33.2",
  "pydeck==0.9.1",
  "python-dateutil==2.9.0.post0",
  "python-multipart==0.0.20",
  "pytz==2025.2",
  "referencing==0.36.2",
  "requests==2.32.4",
  "rpds-py==0.26.0",
  "scikit-learn==1.7.0",
  "scipy==1.16.0",
  "six==1.17.0",
  "smmap==5.0.2",
  "sniffio==1.3.1",
  "starlette==0.47.1",
  "streamlit==1.47.0",
  "tenacity==9.1.2",
  "threadpoolctl==3.6.0",
  "toml==0.10.2",
  "tornado==6.5.1",
  "typing-inspection==0.4.1",
  "typing_extensions==4.14.1",
  "tzdata==2025.2",
  "urllib3==2.5.0",
  "uvicorn==0.35.0",
  "watchdog==6.0.0",
  "xgboost==3.0.2"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[project.urls]
"Bug Reports" = "https://www.micropole.com"
"Funding" = "https://www.micropole.com"
"Homepage" = "https://www.micropole.com"
"Say Thanks!" = "https://www.micropole.com"
"Source" = "https://www.micropole.com"

[project.scripts]
profile = "API_Fraude.main:main"
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["API_Fraude", "API_Fraude.*"]

[tool.setuptools.package-data]
API_Fraude = ["config/*", "config/.*", "data/*.pkl"]
[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"
